[package]
name = "pdfcraft-android"
description = "PdfCraft on Android: the egui app in a GameActivity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# No `[lints] workspace = true`: talking to Java needs `unsafe` (JNI), which the workspace forbids.

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
pdfcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "android-game-activity"] }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
# The same winit as eframe (the workspace patches it to storytold's fork), for `AndroidApp`.
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
log = { workspace = true }
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"
